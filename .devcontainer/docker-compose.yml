services:
  app:
    image: mcr.microsoft.com/devcontainers/java:1-17-bullseye
    volumes:
      - ..:/workspaces/spring-api-starter:cached
    command: sleep infinity
    networks:
      - appnet

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: store_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d store_api"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

networks:
  appnet:

volumes:
  postgres-data:
